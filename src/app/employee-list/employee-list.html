<div class="min-h-screen bg-gray-50 p-6">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="mb-8">
      <div class="flex justify-between items-start">
        <div>
          <h1 class="text-3xl font-bold text-gray-900 mb-2">Gestión de Empleados</h1>
          <p class="text-gray-600">Administra la información de los empleados de la empresa</p>
        </div>
        <button
          (click)="openCreateModal()"
          class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors duration-200 flex items-center space-x-2"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
          </svg>
          <span>Añadir Nuevo</span>
        </button>
      </div>
    </div>

    <!-- Advanced Filters -->
    <app-advanced-filters
      [filterFields]="filterFields"
      [sortableFields]="sortableFields"
      [selectableFields]="selectableFields"
      [availableRelations]="availableRelations"
      (filtersChange)="onFiltersChange($event)"
    />

    <!-- Advanced Data Table -->
    <app-advanced-data-table
      [data]="data"
      [columns]="visibleColumns"
      [actions]="tableActions"
      [loading]="loading"
      [error]="error"
      [currentPageSize]="currentFilters.limit || 20"
      (sortChange)="onSortChange($event)"
      (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)"
      (retry)="onRetry()"
    />

    <!-- Confirmation Modal -->
    <app-confirmation-modal
      [isOpen]="showDeleteModal"
      [title]="'Confirmar eliminación'"
      [message]="employeeToDelete ? '¿Estás seguro de que deseas eliminar a ' + employeeToDelete.name + '? Esta acción no se puede deshacer.' : ''"
      [confirmText]="'Eliminar'"
      [cancelText]="'Cancelar'"
      (confirm)="onConfirmDelete()"
      (cancel)="closeDeleteModal()"
    />

    <!-- Edit Modal -->
    <app-employee-edit-modal
      [isOpen]="showEditModal"
      [employee]="employeeToEdit"
      [isSubmitting]="isSubmittingEdit"
      (save)="onSaveEmployee($event)"
      (cancel)="closeEditModal()"
    />

    <!-- Create Modal -->
    <app-employee-create-modal
      [show]="showCreateModal"
      [isSubmitting]="isSubmittingCreate"
      (save)="onCreateEmployee($event)"
      (cancel)="closeCreateModal()"
    />

    <!-- View Modal -->
    <app-employee-view-modal
      [show]="showViewModal"
      [employee]="employeeToView"
      (close)="closeViewModal()"
    />
</div>
